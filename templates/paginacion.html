{% if pagina.has_other_pages %}
<nav class="paginacion" aria-label="Paginación">
  {% if pagina.has_previous %}
  <a href="?{% if consulta %}{{ consulta }}&amp;{% endif %}page={{ pagina.previous_page_number }}" rel="prev">Anterior</a>
  {% endif %}
  <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
  {% if pagina.has_next %}
  <a href="?{% if consulta %}{{ consulta }}&amp;{% endif %}page={{ pagina.next_page_number }}" rel="next">Siguiente</a>
  {% endif %}
</nav>
{% endif %}
